
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尽誠学園 恋の再会シミュレーション</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #171725;
  color: white;
  font-family: "Yu Gothic", sans-serif;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.game {
  width: 100%;
  max-width: 650px;
  min-height: 650px;
  background: linear-gradient(145deg,#34334c,#171725);
  border: 2px solid #77718e;
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 0 30px #0008;
}
h1 { text-align:center; color:#ffcfdf; }
.subtitle { text-align:center; color:#c4bfd3; }
.characters {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
}
.character {
  background:#45435e;
  border:1px solid #aaa;
  border-radius:12px;
  padding:12px 5px;
  cursor:pointer;
  text-align:center;
  transition:.2s;
}
.character:hover {
  background:#76618e;
  transform:translateY(-4px);
}
.face { font-size:48px; }
.name { font-weight:bold; margin:8px 0; }
.description { font-size:12px; color:#ddd; }
.scene {
  background:#242437;
  border-radius:12px;
  padding:20px;
  margin-top:20px;
  min-height:200px;
  line-height:1.8;
}
.scene-title { color:#ffccdf; font-size:20px; }
.dialogue { margin-top:15px; }
.choices {
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:18px;
}
button {
  padding:13px;
  border:1px solid #bba8d8;
  border-radius:9px;
  background:#625477;
  color:white;
  font-size:15px;
  cursor:pointer;
}
button:hover { background:#9675ae; }
.status {
  display:flex;
  justify-content:space-between;
  color:#ffcfdf;
  font-size:14px;
  margin-top:15px;
}
.hidden { display:none; }
</style>
</head>
<body>
<div class="game">
<h1>尽誠学園</h1>
<p class="subtitle">～あの日の先生と、もう一度。～</p>

<div id="select">
  <p style="text-align:center">
    卒業から数年。久しぶりに母校を訪れたあなた。<br>
    そこで出会う、忘れられない3人の先生とは……
  </p>
  <h3>攻略する先生を選んでください</h3>
  <div class="characters">
    <div class="character" onclick="start('hiyama')">
      <div class="face">👨🏻‍🏫</div>
      <div class="name">日山先生</div>
      <div class="description">50代・英語<br>赤い鼻が特徴</div>
    </div>
    <div class="character" onclick="start('yanai')">
      <div class="face">👨🏻‍🔬</div>
      <div class="name">柳井先生</div>
      <div class="description">生物教師<br>高い声と赤い肌</div>
    </div>
    <div class="character" onclick="start('tachibana')">
      <div class="face">🧑🏻</div>
      <div class="name">橘先生</div>
      <div class="description">20代・元公共教師<br>現在は無職</div>
    </div>
  </div>
</div>

<div id="gameplay" class="hidden">
  <div class="status">
    <span id="characterName"></span>
    <span id="affection">好感度：0</span>
  </div>
  <div class="scene">
    <div class="scene-title" id="sceneTitle"></div>
    <div class="dialogue" id="dialogue"></div>
  </div>
  <div class="choices" id="choices"></div>
</div>

<div id="ending" class="hidden">
  <div class="scene">
    <h2 id="endingTitle"></h2>
    <p id="endingText"></p>
    <h3 id="endingScore"></h3>
  </div>
  <button onclick="location.reload()" style="width:100%">
    タイトルに戻る
  </button>
</div>
</div>

<script>
const characters = {
 hiyama: {
  name:"日山先生",
  scenes:[
   {
    title:"第1話：英語準備室",
    text:"久しぶりの学校。廊下を歩いていると、英語準備室から日山先生が出てきた。鼻が今日も赤い。先生の近くには独特の年季を感じる匂いが漂っている。<br><br>日山「おお……君か。久しぶりじゃないか。元気にしていたか？」",
    choices:[
     ["お久しぶりです！先生に会えて嬉しいです。",2],
     ["先生、鼻が今日も赤いですね。",0],
     ["なんだか懐かしい匂いがしますね……。",1]
    ]
   },
   {
    title:"第2話：突然の英語テスト",
    text:"日山先生が古い英語の教科書を取り出した。<br><br>日山「ところで、君はまだ英語を覚えているか？少し問題を出してみよう」",
    choices:[
     ["もちろんです！挑戦します！",2],
     ["今さら英語ですか！？",0],
     ["先生が教えてくれるなら頑張ります。",3]
    ]
   },
   {
    title:"第3話：放課後の廊下",
    text:"夕暮れの廊下で日山先生と二人きりになった。<br><br>日山「卒業しても、こうして顔を見せに来てくれるのは嬉しいものだな」",
    choices:[
     ["また会いに来てもいいですか？",3],
     ["先生も元気でいてくださいね。",2],
     ["そろそろ帰ります！",0]
    ]
   }
  ]
 },
 yanai: {
  name:"柳井先生",
  scenes:[
   {
    title:"第1話：生物準備室",
    text:"生物準備室の扉を開けると、柳井先生が立っていた。肩が不自然なほど上がっている。<br><br>柳井「えええっ！？久しぶりじゃないですかあ！！」<br>高い声が部屋中に響いた。",
    choices:[
     ["先生、相変わらず声が高いですね！",2],
     ["肩、ずっと上がっていますけど大丈夫ですか？",2],
     ["びっくりした……！",0]
    ]
   },
   {
    title:"第2話：人体の不思議",
    text:"柳井先生は人体模型を指さした。<br><br>柳井「人間の体って面白いですよねえ！ところで、最近どうですかあ？」",
    choices:[
     ["先生の授業を思い出していました。",3],
     ["人体模型が懐かしいです。",2],
     ["先生の声の方が気になります！",1]
    ]
   },
   {
    title:"第3話：夕方の理科室",
    text:"柳井先生と窓際で話す。赤みのある肌に夕日が差し込む。<br><br>柳井「また来てくれて嬉しいですよお。卒業生って、いつまでも大切な存在ですからねえ」",
    choices:[
     ["先生ともっとお話ししたいです。",3],
     ["今度はゆっくり話しましょう！",2],
     ["ありがとうございました！",0]
    ]
   }
  ]
 },
 tachibana: {
  name:"橘先生",
  scenes:[
   {
    title:"第1話：駅前の喫茶店",
    text:"母校の近くの喫茶店。そこにいたのは、かつて公共を教えていた橘先生だった。<br><br>橘「……あれ？久しぶり。まさかこんなところで会うとはね」<br><br>彼はかつて生徒との不適切な関係を持ち、処分を受けて教職を離れている。",
    choices:[
     ["久しぶりです。元気でしたか？",2],
     ["あのときのこと、今はどう考えていますか？",3],
     ["少し話してもいいですか？",2]
    ]
   },
   {
    title:"第2話：過去と向き合う",
    text:"橘先生はコーヒーを見つめたまま話し始めた。<br><br>橘「自分のしたことは間違っていた。相手に対する責任を、今でも考えている。教師ではなくなったから終わり、という話でもないんだ」",
    choices:[
     ["自分の責任から逃げないでください。",3],
     ["これからどう生きるかが大切だと思います。",2],
     ["簡単に許されることではないですよね。",3]
    ]
   },
   {
    title:"第3話：新しい一歩",
    text:"喫茶店を出る時間になった。<br><br>橘「今の自分に何ができるのか、考えてみるよ。君と話せてよかった」",
    choices:[
     ["これからも誠実に生きてください。",3],
     ["また普通にお話ししましょう。",2],
     ["それでは、さようなら。",0]
    ]
   }
  ]
 }
};

let current = "";
let affection = 0;
let step = 0;

function start(id){
 current=id;
 affection=0;
 step=0;
 document.getElementById("select").classList.add("hidden");
 document.getElementById("gameplay").classList.remove("hidden");
 document.getElementById("characterName").textContent=characters[id].name;
 showScene();
}

function showScene(){
 const s=characters[current].scenes[step];
 document.getElementById("sceneTitle").textContent=s.title;
 document.getElementById("dialogue").innerHTML=s.text;
 document.getElementById("affection").textContent="好感度："+affection;
 const box=document.getElementById("choices");
 box.innerHTML="";
 s.choices.forEach(c=>{
  const b=document.createElement("button");
  b.textContent=c[0];
  b.onclick=()=>choose(c[1]);
  box.appendChild(b);
 });
}

function choose(points){
 affection+=points;
 step++;
 if(step<characters[current].scenes.length){
  showScene();
 }else{
  finish();
 }
}

function finish(){
 document.getElementById("gameplay").classList.add("hidden");
 document.getElementById("ending").classList.remove("hidden");

 let title,text;
 if(current==="tachibana"){
  if(affection>=8){
   title="エンディング：再出発";
   text="橘は過去の責任と向き合い、新しい人生を歩み始めた。あなたも彼の誠実な変化を見守ることにした。";
  }else{
   title="エンディング：それぞれの道";
   text="過去は簡単には消えない。二人はそれぞれの道を歩んでいく。";
  }
 }else if(affection>=8){
  title="エンディング：特別な再会";
  text=characters[current].name+"との距離が縮まった。これからも卒業生として、特別な交流が続いていきそうだ。";
 }else if(affection>=4){
  title="エンディング：懐かしい思い出";
  text=characters[current].name+"と楽しい時間を過ごした。久しぶりの再会は忘れられない思い出になった。";
 }else{
  title="エンディング：すれ違い";
  text="会話は少しぎこちないまま終わった。またいつか話せる日が来るかもしれない。";
 }

 document.getElementById("endingTitle").textContent=title;
 document.getElementById("endingText").textContent=text;
 document.getElementById("endingScore").textContent=
 "最終好感度："+affection+" / 24";
}
</script>
</body>
</html>
