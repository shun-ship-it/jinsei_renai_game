<html lang="ja">
<head>
<meta charset="UTF-8">

<title>尽誠学園 恋の再会シミュレーション</title>
<style>
  
.character-emoji {
  font-size: 65px;
  height: 120px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #29283b;
  border-radius: 9px;
  margin-bottom: 8px;
}

.character {
  overflow: hidden;
}
  
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #171725;
  color: white;
  font-family: "Yu Gothic", sans-serif;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.game {
  width: 100%;
  max-width: 650px;
  min-height: 650px;
  background: linear-gradient(145deg,#34334c,#171725);
  border: 2px solid #77718e;
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 0 30px #0008;
}
h1 { text-align:center; color:#ffcfdf; }
.subtitle { text-align:center; color:#c4bfd3; }
.characters {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
}
.character {
  background:#45435e;
  border:1px solid #aaa;
  border-radius:12px;
  padding:12px 5px;
  cursor:pointer;
  text-align:center;
  transition:.2s;
}
.character:hover {
  background:#76618e;
  transform:translateY(-4px);
}
.face { font-size:48px; }
.name { font-weight:bold; margin:8px 0; }
.description { font-size:12px; color:#ddd; }
.scene {
  background:#242437;
  border-radius:12px;
  padding:20px;
  margin-top:20px;
  min-height:200px;
  line-height:1.8;
}
.scene-title { color:#ffccdf; font-size:20px; }
.dialogue { margin-top:15px; }
.choices {
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:18px;
}
button {
  padding:13px;
  border:1px solid #bba8d8;
  border-radius:9px;
  background:#625477;
  color:white;
  font-size:15px;
  cursor:pointer;
}
button:hover { background:#9675ae; }
.status {
  display:flex;
  justify-content:space-between;
  color:#ffcfdf;
  font-size:14px;
  margin-top:15px;
}
.hidden { display:none; }
</style>
</head>
<body>
<div class="game">
<h1>尽誠学園</h1>
<p class="subtitle">～あの日の先生と、もう一度。～</p>
<div id="select">
  <p style="text-align:center">
    卒業から数年。久しぶりに母校を訪れたあなた。<br>
    そこで出会う、忘れられない3人の先生とは……
  </p>
  <h3>攻略する先生を選んでください</h3>
  <div class="characters">

<div class="character" onclick="start('hiyama')">
  <div class="character-emoji">👨🏻‍🏫</div>
  <div class="name">日山先生</div>
  <div class="description">50代・英語<br>赤い鼻が特徴</div>
</div>

<div class="character" onclick="start('yanai')">
  <div class="character-emoji">🧑🏻‍🔬</div>
  <div class="name">柳井先生</div>
  <div class="description">生物教師<br>高い声と赤い肌</div>
</div>

<div class="character" onclick="start('tachibana')">
  <div class="character-emoji">🤷‍♂️</div>
  <div class="name">橘先生</div>
  <div class="description">20代・元公共教師<br>現在は無職</div>
</div>

</div>
</div>

<div id="gameplay" class="hidden">
  <div class="status">
    <span id="characterName"></span>
    <span id="affection">好感度：0</span>
  </div>
  <div class="scene">
    <div class="scene-title" id="sceneTitle"></div>
    <div class="dialogue" id="dialogue"></div>
  </div>
  <div class="choices" id="choices"></div>
</div>

<div id="ending" class="hidden">
  <div class="scene">
    <h2 id="endingTitle"></h2>
    <p id="endingText"></p>
    <h3 id="endingScore"></h3>
  </div>
  <button onclick="location.reload()" style="width:100%">
    タイトルに戻る
  </button>
</div>
</div>

 sentenceIndex=0;

 showSentence();
}

function showSentence(){

 const dialogue=document.getElementById("dialogue");
 const box=document.getElementById("choices");

 dialogue.textContent=sentences[sentenceIndex];

 box.innerHTML="";

 if(sentenceIndex < sentences.length-1){

  const b=document.createElement("button");
  b.textContent="次へ ▶";

  b.onclick=()=>{
   sentenceIndex++;
   showSentence();
  };

  box.appendChild(b);

 }else{

  const s=characters[current].scenes[step];

  s.choices.forEach(c=>{
   const b=document.createElement("button");
   b.textContent=c[0];
   b.onclick=()=>choose(c[1],c[2]);
   box.appendChild(b);
  });

 }
}
  

function choose(points,response){
 affection += points;

 if(
  (current === "hiyama" ||
   current === "yanai" ||
   current === "tachibana") &&
  response
 ){
  const dialogue = document.getElementById("dialogue");
  const box = document.getElementById("choices");

  dialogue.textContent = response;

  document.getElementById("affection").textContent =
   "好感度：" + affection;

  box.innerHTML = "";

  const b = document.createElement("button");
  b.textContent = "次へ ▶";

  b.onclick = () => {
   step++;

   if(step < characters[current].scenes.length){
    showScene();
   }else{
    finish();
   }
  };

  box.appendChild(b);

 }else{
  step++;

  if(step < characters[current].scenes.length){
   showScene();
  }else{
   finish();
  }
 }
}

function finish(){
 document.getElementById("gameplay").classList.add("hidden");
 document.getElementById("ending").classList.remove("hidden");

 let title,text;

 if(current==="tachibana"){
  if(affection>=14){
   title="エンディング：再出発";
   text="橘は自分の過去と責任に向き合う決意を新たにした。これからの人生を誠実に歩むため、新しい一歩を踏み出していく。";
  }else if(affection>=10){
   title="エンディング：静かな決意";
   text="二人の会話を通じて、橘は自分の過去を振り返った。これからどう生きるかは、彼自身の行動にかかっている。";
  }else{
   title="エンディング：それぞれの道";
   text="過去は簡単には消えない。二人はそれぞれの道を歩んでいく。";
  }
 }else if(affection>=16){
  title="エンディング：特別な再会";
  text=characters[current].name+"との距離が縮まった。昔の思い出だけではない、新しい関係が始まりそうだ。";
 }else if(affection>=11){
  title="エンディング：忘れられない再会";
  text=characters[current].name+"とたくさんの話をすることができた。先生にとっても、あなたにとっても忘れられない一日になった。";
 }else if(affection>=7){
  title="エンディング：懐かしい思い出";
  text=characters[current].name+"と楽しい時間を過ごした。久しぶりの再会は懐かしい思い出になった。";
 }else{
  title="エンディング：すれ違い";
  text="会話は少しぎこちないまま終わった。またいつか話せる日が来るかもしれない。";
 }

 document.getElementById("endingTitle").textContent=title;
 document.getElementById("endingText").textContent=text;
 document.getElementById("endingScore").textContent=
 "最終好感度："+affection+" / 18";
}
</script>
</body>
</html>
